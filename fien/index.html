<!DOCTYPE html><html lang="nl"><head>
<meta name="robots" content="noindex,nofollow,noarchive"><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Fien — jouw Bubbly keukenhulp</title>
<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#2A9D8F">
<link rel="apple-touch-icon" href="icon-192.png"><link rel="icon" href="icon-192.png">
<link rel="preload" href="fonts/nunito.woff2" as="font" type="font/woff2" crossorigin>
<script src="vendor/jszip.min.js" defer></script>
<style>
@font-face{font-family:Fraunces;src:url(fonts/fraunces.woff2) format('woff2');font-weight:100 900;font-display:swap}
@font-face{font-family:Nunito;src:url(fonts/nunito.woff2) format('woff2');font-weight:200 1000;font-display:swap}
@font-face{font-family:Caveat;src:url(fonts/caveat.woff2) format('woff2');font-weight:400 700;font-display:swap}
:root{--t:#2A9D8F;--td:#1F7A6F;--cream:#FFF7EC;--paper:#FFFDF8;--pink:#F5A5C2;--cocoa:#3A2A22;--soft:#6B4E3E;--line:#EADBC8;--shadow:0 10px 28px #3a2a2212;--r:22px;--ease:cubic-bezier(.16,1,.3,1)}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:Nunito,system-ui,sans-serif;font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;background:radial-gradient(900px 280px at 50% -80px,#FFE7C4 0%,transparent 60%),linear-gradient(180deg,#FFF4E4 0%,var(--cream) 30%,#FFF9F3 100%);color:var(--cocoa);padding-bottom:calc(112px + env(safe-area-inset-bottom));-webkit-tap-highlight-color:transparent}
h1,h2,h3{font-family:Fraunces,serif;font-weight:560;margin:.2em 0;letter-spacing:-.02em;line-height:1.15}
.hand{font-family:Caveat,cursive;font-size:1.35rem;color:var(--td);line-height:1.15}
header{background:linear-gradient(145deg,#1B6E64 0%,var(--t) 58%,#49C2B2 100%);color:#fff;padding:18px max(16px,calc(50vw - 250px)) 22px;padding-top:calc(16px + env(safe-area-inset-top));border-radius:0 0 32px 32px;display:flex;gap:14px;align-items:center;box-shadow:0 12px 28px #1F7A6F2e}
header img{width:72px;height:72px;border-radius:50%;background:#fff;object-fit:cover;border:3px solid #fff;box-shadow:0 6px 16px #00000022;flex:none}
header h1{font-size:23px;margin:0}
header .hand{color:#FFE9F1;margin:2px 0 0;font-size:1.45rem}
header .kicker{margin:0 0 2px;color:#E5FFF8}
main{padding:18px 16px 8px;max-width:520px;margin:auto}
#view.is-in{animation:fien-in .4s var(--ease)}
.card{background:var(--paper);border:1px solid rgba(234,219,200,.95);border-radius:var(--r);padding:18px 16px;margin:14px 0;box-shadow:var(--shadow)}
.card.hero{border-color:#D5EBE6;background:linear-gradient(180deg,#fff 0%,#F4FBFA 100%);box-shadow:0 12px 32px #1f7a6f12}
.card.soft{background:#FFF9F1}
.card.tip{display:flex;gap:12px;align-items:center}
.card.tip img{width:48px;height:48px;border-radius:50%;object-fit:cover;flex:none;background:#fff}
.card.tip b{display:block;font:800 12px Nunito;letter-spacing:.06em;text-transform:uppercase;color:var(--td);margin-bottom:2px}
.card.quiet{background:transparent;box-shadow:none;border:0;padding:0 2px;margin:6px 0 10px}
.card.quiet summary{min-height:48px;color:var(--soft)}
.card.quiet[open]{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:4px 14px 14px;box-shadow:none}
button.card{font:inherit;color:inherit;cursor:pointer;width:100%;text-align:left;display:flex;align-items:center;gap:10px;appearance:none;-webkit-appearance:none}
button.card:active{transform:scale(.985)}
.chev{font:500 26px/1 Fraunces;color:var(--td);flex:none}
.btn{border:0;border-radius:16px;padding:12px 16px;font:800 15px/1.2 Nunito,system-ui,sans-serif;background:var(--td);color:#fff;cursor:pointer;min-height:48px;box-shadow:0 8px 16px #1f7a6f24;transition:transform .16s var(--ease),box-shadow .16s,background .16s}
.btn:active{transform:scale(.98);box-shadow:0 3px 8px #1f7a6f22}
.btn.s{background:#fff;color:var(--td);border:1.5px solid #B7DDD6;box-shadow:none}
.btn.p{background:var(--pink);color:var(--cocoa);box-shadow:0 8px 16px #f5a5c230}
.btn.ghost{background:transparent;color:var(--soft);border:0;box-shadow:none;padding-left:10px;padding-right:10px}
.btn.xl{font-size:17px;min-height:56px;width:100%;border-radius:18px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.grow{flex:1;min-width:0}
.lbl{display:block;font:800 13px Nunito;color:var(--soft);margin:8px 0 6px}
input,textarea,select{width:100%;font:16px/1.4 Nunito,system-ui,sans-serif;padding:12px 14px;border-radius:16px;border:1.5px solid var(--line);background:#fff;color:var(--cocoa)}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--t);box-shadow:0 0 0 4px #2A9D8F1f}
textarea{min-height:72px;resize:vertical}
nav{position:fixed;z-index:40;left:50%;transform:translateX(-50%);width:min(520px,calc(100% - 20px));bottom:calc(10px + env(safe-area-inset-bottom));display:flex;gap:4px;justify-content:space-between;padding:6px;background:rgba(255,253,248,.94);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid rgba(234,219,200,.95);border-radius:22px;box-shadow:0 12px 32px #3a2a221c}
nav button{border:0;background:none;font:700 12px/1 Nunito,system-ui,sans-serif;color:var(--soft);display:flex;flex-direction:column;align-items:center;gap:3px;flex:1;min-height:54px;justify-content:center;border-radius:16px;transition:background .22s,color .22s}
nav button b{font-size:20px;line-height:1;transition:transform .22s var(--ease)}
nav button.on{color:var(--td);background:#E7F6F3}
nav button.on b{transform:translateY(-1px)}
.note{background:#E7F6F3;border-left:4px solid var(--t);padding:12px 14px;border-radius:14px;font-size:14.5px;line-height:1.45}
.bar{height:10px;background:#F0E6D8;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--td),#3BB8A8);border-radius:99px;transition:width .4s var(--ease)}
.step{border-left:4px solid var(--line)}.step.done{border-left-color:var(--t);background:#F7FFFD}
.thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.thumbs img,.thumbs video{width:64px;height:84px;object-fit:cover;border-radius:12px;border:1px solid var(--line)}
.chk{display:inline-block;padding:4px 10px;border-radius:99px;font-size:12px;font-weight:800;background:#F0E6D8;margin:2px}.chk.ok{background:#CDEDE8;color:var(--td)}
.tag{font-size:11px;font-weight:800;letter-spacing:.03em;background:#FFE9C7;color:#6B4E3E;padding:3px 9px;border-radius:99px}
.big{font:560 54px/1 Fraunces,serif;text-align:center;margin:8px 0}
.swipe{touch-action:pan-y;transition:transform .25s var(--ease)}.hidden{display:none!important}
small{color:#6B5346;line-height:1.4}
.btn.xs{min-height:44px;padding:8px 14px;font-size:14px}
.btn:focus-visible,nav button:focus-visible,summary:focus-visible,.fien-add:focus-visible{outline:3px solid var(--pink);outline-offset:2px}
.btn[disabled]{opacity:.45;box-shadow:none}
.btn.kook{width:100%;font-size:18px;min-height:60px;margin:6px 0;background:var(--cocoa);border-radius:18px;box-shadow:0 8px 16px #3a2a2224}
#kook{position:fixed;inset:0;z-index:50;background:var(--cream);display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom)}
#kook .kt{background:var(--td);color:#fff;padding:12px 14px;padding-top:calc(12px + env(safe-area-inset-top));display:flex;gap:10px;align-items:center}
.kx{width:52px;height:52px;border-radius:50%;border:0;background:#fff;color:var(--td);font:800 22px Nunito,system-ui,sans-serif}
.kp{display:flex;gap:4px;margin-top:6px}.kp i{flex:1;height:7px;border-radius:9px;background:#ffffff55;max-width:40px}.kp i.on{background:var(--pink)}
#onb .kp i{background:var(--line)}#onb .kp i.on{background:var(--td)}
#kook .kb{flex:1;overflow:auto;padding:18px 18px 8px}.kn1{font:800 14px Nunito,system-ui,sans-serif;color:var(--soft);letter-spacing:.06em;text-transform:uppercase}
.kv{font:560 clamp(44px,13vw,72px)/1.05 Fraunces,serif;color:var(--td);margin:6px 0 10px}.ktx{font-size:clamp(22px,6vw,28px);line-height:1.4;margin:0 0 14px}
#kook .kf{display:flex;gap:10px;padding:10px 14px}.kn{flex:1;min-height:72px;font-size:20px}.kc{font-size:20px;min-height:56px}
#kook .big{font-size:60px}
#onb{position:fixed;inset:0;z-index:60;background:#3A2A22b8;display:flex;align-items:center;padding:16px}
#onb .card{text-align:center;padding:22px 18px}
.path{display:flex;gap:8px;align-items:stretch;margin:14px 0 8px;overflow-x:auto}
.path .p{flex:1;min-width:68px;text-align:center;padding:10px 4px;border-radius:16px;background:#fff;border:1.5px solid var(--line);font-size:11px;font-weight:800;color:var(--soft);transition:background .2s,border-color .2s,color .2s}
.path .p b{display:block;font:560 18px/1.1 Fraunces,serif;margin-bottom:3px}
.path .p.on{border-color:var(--t);background:#E7F6F3;color:var(--td)}
.path .p.done{border-color:#8BCFBF;background:#F0FAF8}
.empty{text-align:center;padding:22px 12px 8px}
.empty img{width:92px;height:92px;border-radius:50%;object-fit:cover;margin-bottom:8px;border:3px solid #fff;box-shadow:var(--shadow);background:#fff}
.empty p{margin:6px 0}
.kicker{font:800 11px/1 Nunito,system-ui,sans-serif;letter-spacing:.12em;text-transform:uppercase;color:var(--td)}
details summary{cursor:pointer;font-weight:800;min-height:44px;display:flex;align-items:center}
details summary::-webkit-details-marker{color:var(--td)}
.pcard{padding:18px;margin:14px 0}.pcard h3,.pcard > .row > b{font-size:18px}
.pcard .decrow{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:12px}
.pcard .decrow .btn{width:100%;margin:0}
.pcard.dk-Eens{border-color:var(--t);box-shadow:0 0 0 2px #2A9D8F28}
.pcard.dk-Nieteens{border-color:#E2C2A2}
.pcard.dk-Aanpassen{border-color:var(--pink)}
.stagepill{border-radius:99px!important;padding:8px 12px!important;font-size:13px!important}
.meer-link{display:flex;align-items:center;gap:12px;padding:16px;margin:10px 0;background:var(--paper);border:1px solid var(--line);border-radius:20px;text-decoration:none;color:inherit;box-shadow:var(--shadow);transition:transform .16s var(--ease)}
.meer-link b{font-size:22px;width:28px;text-align:center}
.meer-link strong{font-size:16px}
.meer-link:active{transform:scale(.985)}
/* Fien-composer + status */
.fien-sheet{background:linear-gradient(180deg,#fff 0%,#FFFcf7 100%);border:1px solid #E7D7C4;border-radius:28px;padding:18px 16px 14px;margin:4px 0 8px;box-shadow:0 16px 40px #3a2a2214}
.fien-head{display:flex;gap:12px;align-items:center;margin-bottom:14px}
.fien-head img{width:58px;height:58px;border-radius:50%;object-fit:cover;background:#fff;border:2px solid #fff;box-shadow:0 6px 16px #3a2a2218;flex:none}
.fien-head h2{font-size:26px;margin:2px 0 0}
.fien-lead{margin:4px 0 0;color:var(--soft);font-size:14.5px;line-height:1.35}
#ai-idee{min-height:92px;font-size:17px;line-height:1.4;border-radius:18px;padding:14px 14px 12px;background:#fff}
.fien-add{display:flex;align-items:center;gap:8px;width:100%;margin-top:4px;padding:8px 2px;min-height:44px;border:0;background:transparent;color:var(--td);font:800 15px Nunito,system-ui,sans-serif;cursor:pointer;text-align:left}
.fien-plus{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;background:#E7F6F3;font-size:18px;line-height:1;flex:none}
.fien-bron{background:#FBF6EF;border-radius:18px;padding:12px;margin-top:2px}
.fien-hint{margin:8px 0;font-size:13.5px;color:var(--soft);line-height:1.4}
.fien-bron-row{margin-top:8px}
.fien-go{margin-top:12px}
.fien-fine{text-align:center;margin:8px 0 0;font-size:12.5px;color:#6B5346}
.fien-empty{display:flex;align-items:center;gap:10px;margin:14px 2px 4px;color:var(--soft);font-size:14.5px;line-height:1.35}
.fien-empty img{width:42px;height:42px;border-radius:50%;object-fit:cover;flex:none;background:#fff}
.ai-list-h{margin:18px 2px 0;font:800 12px/1 Nunito,system-ui,sans-serif;letter-spacing:.08em;text-transform:uppercase;color:var(--soft)}
.ai-list{display:flex;flex-direction:column;gap:10px;margin-top:8px}
.ai-card{border-radius:18px;padding:14px 14px 12px;border:1px solid var(--line);background:#fff;animation:fien-in .32s var(--ease) both}
.ai-card.bezig{background:#FFF9F1;border-color:#F0E2CC}
.ai-card.fout{background:#FFF6F1;border-color:#F0D4C6}
.ai-card.klaar{background:#F3FBF9;border-color:#D3EBE6}
.ai-top{display:flex;gap:10px;align-items:flex-start}
.ai-title{font-size:18px;margin:0}
.ai-meta{display:block;margin-top:3px;font-size:12.5px}
.ai-pill{display:inline-flex;align-items:center;gap:6px;flex:none;font:800 12px Nunito,system-ui,sans-serif;padding:5px 10px;border-radius:99px;background:#F0E6D8;color:var(--soft)}
.ai-pill.bezig{background:#FFE9C7;color:#7A5314}
.ai-pill.klaar{background:#CDEDE8;color:var(--td)}
.ai-pill.fout{background:#F8DCCE;color:#8A4324}
.ai-pill.bezig::before{content:"";width:7px;height:7px;border-radius:50%;background:#C4843A;animation:pulse 1.6s ease-in-out infinite}
.ai-msg{margin:10px 0 0;font-size:15.5px;line-height:1.45}
.ai-note{margin:8px 0 0;font-size:13.5px;line-height:1.4;color:var(--soft)}
.ai-acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;align-items:center}
.ai-acts .btn:not(.ghost){flex:1 1 140px}
.ai-chips{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.ai-chip{display:flex;align-items:center;gap:4px;background:#F4FBFA;border:1px solid #D5EBE6;border-radius:14px;padding:4px 6px 4px 12px;font-size:13.5px}
.ai-chip-t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ai-mini{border:0;background:transparent;color:var(--td);font:800 13px Nunito,system-ui,sans-serif;min-height:36px;padding:4px 8px;cursor:pointer;border-radius:10px}
.ai-mini:active{background:#E7F6F3}
.ai-banner{margin-top:12px;padding:12px;border-radius:16px;background:#F4FBFA;border:1px solid #D5EBE6;display:flex;flex-direction:column;align-items:flex-start;gap:8px}
.ai-banner.bezig{background:#FFF8EE;border-color:#F0E0C8}
.ai-banner.fout{background:#FFF6F1;border-color:#F0D4C6}
.ai-banner-t,.ai-banner-row{display:flex;gap:8px;align-items:center;width:100%}
.fien-fall{margin-top:8px;border-top:1px solid var(--line);padding-top:2px}
.fien-fall summary{font-size:14px;color:var(--soft);font-weight:800}
.fien-fall textarea{margin-top:4px}
@keyframes fien-in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes pulse{0%,100%{opacity:.4;transform:scale(.88)}50%{opacity:1;transform:scale(1.12)}}
@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{animation:none!important;transition:none!important}
}
</style></head><body>
<header><img src="img/fien-hero-320w.webp" alt="Fien"><div><p class="kicker">The Bubbly Bakery</p><h1>Hoi Suzan, Fien hier!</h1><p class="hand">Bak met liefde, niet met perfectie</p></div></header>
<main id="view"></main>
<nav id="nav"></nav>
<script src="app.js"></script><script src="recepten.js"></script><script src="kook.js"></script><script src="pijplijn.js"></script><script src="fienai.js"></script></body></html>
