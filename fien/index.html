<!DOCTYPE html><html lang="nl"><head>
<meta name="robots" content="noindex,nofollow,noarchive"><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Fien — jouw Bubbly keukenhulp</title>
<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#2A9D8F">
<link rel="apple-touch-icon" href="icon-192.png"><link rel="icon" href="icon-192.png">
<link rel="preload" href="fonts/nunito.woff2" as="font" type="font/woff2" crossorigin>
<script src="vendor/jszip.min.js" defer></script>
<style>
@font-face{font-family:Fraunces;src:url(fonts/fraunces.woff2) format('woff2');font-weight:100 900;font-display:swap}
@font-face{font-family:Nunito;src:url(fonts/nunito.woff2) format('woff2');font-weight:200 1000;font-display:swap}
@font-face{font-family:Caveat;src:url(fonts/caveat.woff2) format('woff2');font-weight:400 700;font-display:swap}
:root{--t:#2A9D8F;--td:#1F7A6F;--cream:#FFF7EC;--paper:#FFFDF8;--pink:#F5A5C2;--cocoa:#3A2A22;--soft:#6B4E3E;--line:#EADBC8;--shadow:0 4px 18px #3a2a2214;--r:20px}
*{box-sizing:border-box}body{margin:0;font-family:Nunito,system-ui,sans-serif;background:linear-gradient(180deg,#FFF3E0 0%,var(--cream) 28%,var(--cream) 100%);color:var(--cocoa);padding-bottom:92px;-webkit-tap-highlight-color:transparent}
h1,h2,h3{font-family:Fraunces,serif;margin:.2em 0;letter-spacing:-.02em}.hand{font-family:Caveat,cursive;font-size:1.4em;color:var(--td);line-height:1.2}
header{background:linear-gradient(135deg,var(--td),var(--t) 60%,#3BB8A8);color:#fff;padding:16px 16px 22px;border-radius:0 0 28px 28px;display:flex;gap:12px;align-items:center;box-shadow:0 8px 24px #1F7A6F33}
header img{width:68px;height:68px;border-radius:50%;background:#fff;object-fit:cover;border:3px solid #fff;box-shadow:0 2px 10px #0002}header .hand{color:#FFE9F1}
main{padding:16px 14px;max-width:560px;margin:auto}
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin:12px 0;box-shadow:var(--shadow)}
.card.hero{border:2px solid var(--t);background:linear-gradient(165deg,#fff 0%,#E8F7F4 100%);padding:18px}
.card.soft{background:#FFF9F0}
.btn{border:0;border-radius:16px;padding:12px 16px;font:800 15px Nunito;background:var(--td);color:#fff;cursor:pointer;min-height:48px;transition:transform .12s,box-shadow .12s}.btn:active{transform:scale(.97)}.btn.s{background:#fff;color:var(--td);border:2px solid var(--t)}.btn.p{background:var(--pink);color:var(--cocoa)}.btn.xl{font-size:17px;min-height:56px;width:100%}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.grow{flex:1}
input,textarea,select{width:100%;font:15px Nunito;padding:12px 14px;border-radius:14px;border:1.5px solid var(--line);background:#fff}input:focus,textarea:focus,select:focus{outline:none;border-color:var(--t);box-shadow:0 0 0 3px #2A9D8F22}textarea{min-height:70px}
nav{position:fixed;bottom:0;left:0;right:0;background:rgba(255,253,248,.94);backdrop-filter:blur(10px);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:6px 4px calc(8px + env(safe-area-inset-bottom));box-shadow:0 -4px 20px #3a2a220c;z-index:40}
nav button{border:0;background:none;font:700 11px Nunito;color:var(--soft);display:flex;flex-direction:column;align-items:center;gap:2px;flex:1;min-height:56px;justify-content:center;border-radius:14px}nav button b{font-size:22px;line-height:1.1}nav button.on{color:var(--td);background:#E6F4F2}
.note{background:#E6F4F2;border-left:4px solid var(--t);padding:12px 14px;border-radius:12px;font-size:14px}
.bar{height:12px;background:#F0E6D8;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--td),var(--t));border-radius:99px;transition:width .35s}
.step{border-left:4px solid var(--line)}.step.done{border-left-color:var(--t);background:#F7FFFD}.thumbs{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.thumbs img,.thumbs video{width:64px;height:84px;object-fit:cover;border-radius:12px;border:1px solid var(--line)}
.chk{display:inline-block;padding:4px 10px;border-radius:99px;font-size:12px;font-weight:800;background:#F0E6D8;margin:2px}.chk.ok{background:#CDEDE8;color:var(--td)}
.tag{font-size:11px;font-weight:800;background:#FFE9C7;padding:3px 9px;border-radius:99px}.big{font:700 54px Fraunces;text-align:center;margin:8px 0}
.swipe{touch-action:pan-y;transition:transform .25s}.hidden{display:none}small{color:#5B4033}
.btn.xs{min-height:44px;padding:8px 12px;font-size:14px;margin-top:6px}.btn:focus-visible,nav button:focus-visible{outline:3px solid var(--pink);outline-offset:2px}.btn[disabled]{opacity:.4}
.btn.kook{width:100%;font-size:19px;min-height:60px;margin:6px 0;background:var(--cocoa);border-radius:18px}
#kook{position:fixed;inset:0;z-index:50;background:var(--cream);display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom)}
#kook .kt{background:var(--td);color:#fff;padding:12px 14px;padding-top:calc(12px + env(safe-area-inset-top));display:flex;gap:10px;align-items:center}
.kx{width:52px;height:52px;border-radius:50%;border:0;background:#fff;color:var(--td);font:800 22px Nunito}
.kp{display:flex;gap:4px;margin-top:6px}.kp i{flex:1;height:7px;border-radius:9px;background:#ffffff55;max-width:40px}.kp i.on{background:var(--pink)}
#onb .kp i{background:var(--line)}#onb .kp i.on{background:var(--td)}
#kook .kb{flex:1;overflow:auto;padding:18px 18px 8px}.kn1{font:800 16px Nunito;color:var(--soft);letter-spacing:.04em;text-transform:uppercase}
.kv{font:700 clamp(44px,13vw,72px)/1.05 Fraunces;color:var(--td);margin:6px 0 10px}.ktx{font-size:clamp(22px,6vw,28px);line-height:1.4;margin:0 0 14px}
#kook .kf{display:flex;gap:10px;padding:10px 14px}.kn{flex:1;min-height:72px;font-size:21px}.kc{font-size:20px;min-height:56px}
#kook .big{font-size:60px}
#onb{position:fixed;inset:0;z-index:60;background:#3A2A22cc;display:flex;align-items:center;padding:14px}
/* journey + empty + decision polish */
.path{display:flex;gap:6px;align-items:stretch;margin:12px 0 4px;overflow-x:auto}.path .p{flex:1;min-width:68px;text-align:center;padding:8px 4px;border-radius:14px;background:#fff;border:1.5px solid var(--line);font-size:11px;font-weight:800;color:var(--soft)}.path .p b{display:block;font-size:20px;margin-bottom:2px}.path .p.on{border-color:var(--t);background:#E6F4F2;color:var(--td)}.path .p.done{border-color:#8BCFBF;background:#F0FAF8}
.empty{text-align:center;padding:28px 16px}.empty img{width:96px;height:96px;border-radius:50%;margin-bottom:8px;border:3px solid #fff;box-shadow:var(--shadow)}
.aibusy{display:inline-flex;align-items:center;gap:8px}.aibusy::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--t);animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.35;transform:scale(.85)}50%{opacity:1;transform:scale(1.15)}}
@media (prefers-reduced-motion:reduce){.aibusy::before{animation:none}.btn{transition:none}}
.pcard{padding:18px;margin:14px 0}.pcard h3,.pcard > .row > b{font-size:18px}.pcard .decrow{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:10px}.pcard .decrow .btn{width:100%;margin:0}
.pcard.dk-Eens{border-color:var(--t);box-shadow:0 0 0 2px #2A9D8F33}.pcard.dk-Nieteens{border-color:#C76B00;opacity:.85}.pcard.dk-Aanpassen{border-color:var(--pink)}
.stagepill{border-radius:99px!important;padding:8px 12px!important;font-size:13px!important}
.meer-link{display:flex;align-items:center;gap:12px;padding:14px;margin:8px 0;background:var(--paper);border:1px solid var(--line);border-radius:16px;text-decoration:none;color:inherit;box-shadow:var(--shadow)}.meer-link b{font-size:22px}.meer-link:active{transform:scale(.98)}
</style></head><body>
<header><img src="img/fien-hero-320w.webp" alt="Fien"><div><h1 style="font-size:22px">Hoi Suzan, Fien hier!</h1><div class="hand">Bak met liefde, niet met perfectie</div></div></header>
<main id="view"></main>
<nav id="nav"></nav>
<script src="app.js"></script><script src="recepten.js"></script><script src="kook.js"></script><script src="pijplijn.js"></script><script src="fienai.js"></script></body></html>
