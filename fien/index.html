<!DOCTYPE html><html lang="nl"><head>
<meta name="robots" content="noindex,nofollow,noarchive"><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Fien — jouw Bubbly keukenhulp</title>
<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#2A9D8F">
<link rel="apple-touch-icon" href="icon-192.png"><link rel="icon" href="icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Nunito:wght@400;600;800&family=Caveat:wght@600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js" defer></script>
<style>
:root{--t:#2A9D8F;--td:#1F7A6F;--cream:#FFF7EC;--paper:#FFFDF8;--pink:#F5A5C2;--cocoa:#3A2A22;--soft:#6B4E3E;--line:#EADBC8}
*{box-sizing:border-box}body{margin:0;font-family:Nunito,system-ui,sans-serif;background:var(--cream);color:var(--cocoa);padding-bottom:84px}
h1,h2,h3{font-family:Fraunces,serif;margin:.2em 0}.hand{font-family:Caveat,cursive;font-size:1.35em;color:var(--td)}
header{background:var(--t);color:#fff;padding:14px 16px 18px;border-radius:0 0 22px 22px;display:flex;gap:12px;align-items:center}
header img{width:64px;height:64px;border-radius:50%;background:#fff;object-fit:cover}header .hand{color:#FFE9F1}
main{padding:14px;max-width:560px;margin:auto}.card{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:14px;margin:10px 0;box-shadow:0 2px 8px #3a2a2210}
.btn{border:0;border-radius:14px;padding:11px 14px;font:800 15px Nunito;background:var(--t);color:#fff;cursor:pointer}.btn.s{background:#fff;color:var(--td);border:2px solid var(--t)}.btn.p{background:var(--pink);color:var(--cocoa)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.grow{flex:1}
input,textarea,select{width:100%;font:15px Nunito;padding:10px;border-radius:12px;border:1px solid var(--line);background:#fff}textarea{min-height:70px}
nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:6px 0 calc(6px + env(safe-area-inset-bottom))}
nav button{border:0;background:none;font:700 11px Nunito;color:var(--soft);display:flex;flex-direction:column;align-items:center;gap:2px}nav button b{font-size:21px}nav button.on{color:var(--t)}
.note{background:#E6F4F2;border-left:4px solid var(--t);padding:10px 12px;border-radius:10px;font-size:14px}
.bar{height:10px;background:#eee;border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:var(--t)}
.step{border-left:4px solid var(--line)}.step.done{border-left-color:var(--t)}.thumbs{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.thumbs img,.thumbs video{width:64px;height:84px;object-fit:cover;border-radius:10px;border:1px solid var(--line)}
.chk{display:inline-block;padding:3px 9px;border-radius:99px;font-size:12px;font-weight:800;background:#eee;margin:2px}.chk.ok{background:#CDEDE8;color:var(--td)}
.tag{font-size:11px;font-weight:800;background:#FFE9C7;padding:2px 8px;border-radius:99px}.big{font:700 54px Fraunces;text-align:center;margin:8px 0}
.swipe{touch-action:pan-y;transition:transform .25s}.hidden{display:none}small{color:var(--soft)}
</style></head><body>
<header><img src="img/fien-hero-320w.webp" alt="Fien"><div><h1 style="font-size:22px">Hoi Suzan, Fien hier!</h1><div class="hand">Bak met liefde, niet met perfectie</div></div></header>
<main id="view"></main>
<nav id="nav"></nav>
<script src="app.js"></script><script src="recepten.js"></script></body></html>
