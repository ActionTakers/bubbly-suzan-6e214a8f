<!DOCTYPE html>
<html lang="nl"><head>
<meta name="robots" content="noindex,nofollow"><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Bubbly Besluiten — voor Suzan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Nunito:wght@400;600;800&family=Caveat:wght@600&display=swap" rel="stylesheet">
<style>
:root{--cream:#FFF7EC;--cream2:#FBEEDA;--paper:#FFFDF8;--pink:#F5A5C2;--pinkd:#E5789F;--cocoa:#3A2A22;--cocoas:#6B4E3E;--line:#E8D9C4;--butter:#FFD98A;--mint:#B6E3C6;--berry:#C94A6B;--sh:0 8px 24px rgba(107,78,62,.18);--sh2:0 3px 10px rgba(107,78,62,.14)}
*{box-sizing:border-box}html,body{margin:0;background:var(--cream);color:var(--cocoa);font:16px/1.4 Nunito,system-ui,sans-serif}
body{max-width:480px;margin:auto;min-height:100vh;display:flex;flex-direction:column;padding:12px 14px 18px}
header{display:flex;align-items:center;gap:10px}
h1{font:700 1.45rem Fraunces,serif;margin:0}.hand{font-family:Caveat,cursive;color:var(--pinkd);font-size:1.25rem}
.tabs{display:flex;gap:6px;margin:10px 0 6px;background:var(--cream2);padding:4px;border-radius:999px}
.tabs button{flex:1;border:0;background:transparent;border-radius:999px;padding:8px 4px;font:800 .9rem Nunito;color:var(--cocoas);cursor:pointer}
.tabs button[aria-selected=true]{background:var(--paper);color:var(--cocoa);box-shadow:var(--sh2)}
.meta{display:flex;justify-content:space-between;font-size:.85rem;color:var(--cocoas)}
.note{font-size:.8rem;color:var(--cocoas);background:var(--cream2);border-radius:14px;padding:6px 10px;margin:6px 0;text-align:center}
.stack{position:relative;flex:1;min-height:440px;margin:8px 0}
.card{position:absolute;inset:0;background:var(--paper);border:1.5px solid var(--line);border-radius:26px;box-shadow:var(--sh);padding:16px;display:flex;flex-direction:column;gap:8px;touch-action:none;user-select:none;overflow:auto;transition:transform .25s}
.card.back{transform:scale(.95) translateY(12px);opacity:.7;pointer-events:none}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.badge{display:inline-block;border-radius:999px;padding:3px 10px;font-weight:800;font-size:.75rem;background:var(--cream2);border:1px solid var(--line)}
.r1{transform:rotate(-3deg)}.r2{transform:rotate(2deg)}.r3{transform:rotate(-1.5deg)}.r4{transform:rotate(3deg)}
.b-ver{background:var(--mint)}.b-cl{background:var(--butter)}.b-id{background:var(--pink)}
.card h2{font:700 1.2rem Fraunces,serif;margin:2px 0}
.lab{font-weight:800;font-size:.75rem;text-transform:uppercase;letter-spacing:.04em;color:var(--cocoas);margin-top:2px}
.card p{margin:0}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
.chip{border:1.5px solid var(--pinkd);background:var(--paper);color:var(--cocoa);border-radius:999px;padding:8px 12px;font:800 .9rem Nunito;cursor:pointer}
.chip:active,.chip.on{background:var(--pink)}
textarea{width:100%;border:1.5px solid var(--line);border-radius:16px;padding:8px;font:inherit;background:var(--cream);min-height:46px;resize:vertical}
.stamp{position:absolute;top:22px;padding:4px 14px;border-radius:14px;font:700 1.5rem Fraunces;opacity:0;border:3px solid}
.st-go{left:18px;color:#2f7a4f;border-color:var(--mint);transform:rotate(-8deg)}.st-no{right:18px;color:var(--cocoa);border-color:var(--pink);transform:rotate(8deg)}.st-la{left:50%;transform:translateX(-50%);color:var(--cocoa);border-color:var(--butter)}
.acts{display:flex;justify-content:center;gap:10px}
.act{border:0;border-radius:999px;padding:12px 14px;font:800 .95rem Nunito;display:flex;align-items:center;gap:6px;cursor:pointer;box-shadow:var(--sh2);color:var(--cocoa)}
.a-no{background:var(--pink)}.a-la{background:var(--butter)}.a-go{background:var(--mint)}.a-un{background:var(--paper);border:1.5px solid var(--line)}
.act svg{width:18px;height:18px}
.foot{display:flex;gap:8px;margin-top:10px}.foot .act{flex:1;justify-content:center;background:var(--paper);border:1.5px solid var(--line)}
.who{font-family:Caveat;font-size:1.2rem}.who input{font:600 1rem Nunito;border:1.5px solid var(--line);border-radius:999px;padding:4px 10px;width:110px;background:var(--paper)}
#result{display:none;flex-direction:column;gap:8px}
.ri{background:var(--paper);border:1.5px solid var(--line);border-radius:18px;padding:10px;box-shadow:var(--sh2)}
.empty{text-align:center;padding:40px 10px}
.toast{position:fixed;left:50%;bottom:130px;pointer-events:none;transform:translateX(-50%);background:var(--cocoa);color:var(--paper);padding:8px 16px;border-radius:999px;opacity:0;transition:.3s}
.ava{width:52px;height:52px;border-radius:50%;background:var(--cream2);border:2px solid var(--pink);object-fit:contain;padding:3px;box-shadow:var(--sh2)}
.hi{display:flex;align-items:center;gap:8px;background:var(--paper);border:1.5px solid var(--line);border-radius:20px;padding:6px 10px;margin:6px 0;box-shadow:var(--sh2)}
.hi img{width:64px;height:64px;object-fit:contain}.hi p{margin:0}
.fx{position:fixed;left:50%;bottom:120px;transform:translate(-50%,20px) scale(.9);display:flex;align-items:center;gap:6px;background:var(--paper);border:1.5px solid var(--line);border-radius:22px;padding:6px 14px 6px 6px;box-shadow:var(--sh);opacity:0;transition:.3s;pointer-events:none;z-index:9}
.fx.on{opacity:1;transform:translate(-50%,0) scale(1)}.fx img{width:56px;height:56px;object-fit:contain}.fx span{font:600 1.35rem Caveat,cursive;color:var(--pinkd);white-space:nowrap}
.pr{display:flex;align-items:center;gap:10px;justify-content:center}.pr img{width:110px;height:110px;object-fit:contain}
.card p{white-space:pre-line}.chips,.chip{position:relative;z-index:5;pointer-events:auto;touch-action:manipulation;-webkit-tap-highlight-color:transparent}.chip{min-height:44px}.card textarea{touch-action:manipulation;user-select:text}</style></head><body>

const K="bubbly-suzan-16-vragen-v1";let st=JSON.parse(localStorage.getItem(K)||'{"d":{},"h":[],"c":{}}');
let F="Alles";const $=s=>document.querySelector(s);
const save=()=>localStorage.setItem(K,JSON.stringify(st));
const inF=c=>F==="Alles"||c.who.includes(F);
const todo=()=>{const a=C.filter(c=>inF(c)&&!st.d[c.id]);const l=C.filter(c=>inF(c)&&st.d[c.id]&&st.d[c.id].v==="Later");return a.concat(l.filter(c=>!a.includes(c)))};
const esc=s=>String(s).replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
function cardHTML(c,back){const rot=["r1","r2","r3","r4"];return `<article class="card ${back?"back":""}" data-id="${c.id}">
<div class="stamp st-go">GO</div><div class="stamp st-no">Nee</div><div class="stamp st-la">Later</div>
<div class="row"><span class="badge b-id r1">${c.id}</span><span class="badge ${c.s==="VERIFIED"?"b-ver":"b-cl"} r2">${c.s}</span><span class="badge r3">${c.r}</span><span class="badge r4">beslist: ${esc(c.who)}</span></div>
<h2>${esc(c.t)}</h2><div class="lab">Waar gaat het om</div><p>${esc(c.p)}</p><div class="lab">De vraag</div><p>${esc(c.f)}</p>
${c.src?`<div class="lab">Bron</div><p>${esc(c.src)}</p>`:""}
${c.rb?`<div class="lab">Terugdraaien</div><p>${esc(c.rb)}</p>`:""}
${st.d[c.id]&&st.d[c.id].v==="Later"?'<p class="hand">Weer aan de beurt!</p>':""}
${c.o?`<div class="lab">Kies een optie</div><div class="chips">${c.o.map(o=>`<button class="chip" data-o="${esc(o)}">${esc(o)}</button>`).join("")}</div>`:""}
<div class="lab">Opmerking (mag leeg)</div><textarea aria-label="Opmerking" placeholder="Iets toevoegen?">${esc(st.c[c.id]||"")}</textarea></article>`}
function render(){const res=F==="res";$("#stack").style.display=res?"none":"block";$("#acts").style.display=res?"none":"flex";$("#result").style.display=res?"flex":"none";
const n=C.filter(c=>c.id&&(F==="res"||inF(c))),done=n.filter(c=>st.d[c.id]&&st.d[c.id].v!=="Later").length;$("#count").textContent=`${done} van ${n.length} besloten`;
$("#hi").style.display=Object.keys(st.d).length?"none":"flex";if(res)return renderRes();const t=todo();
if(!t.length){$("#stack").innerHTML=`<div class="empty"><img src="${FI.trots}" alt="Fien trots" style="width:140px;height:140px;object-fit:contain"><p class="hand" style="font-size:1.8rem">Alles besloten, top!</p><p>Kijk bij Overzicht of exporteer.</p></div>`;return}
const cur=t[0],o=cur.o;$("#bGo").style.display=o?"none":"flex";$("#bNo").style.display=o?"none":"flex";
$("#stack").innerHTML=(t[1]?cardHTML(t[1],1):"")+cardHTML(cur);bind($("#stack").lastElementChild,cur)}
function bind(el,c){el.querySelector("textarea").addEventListener("input",e=>{st.c[c.id]=e.target.value;save()});
el.querySelectorAll(".chip").forEach(b=>{let done=0;const go=e=>{e.stopPropagation();e.preventDefault();if(done)return;done=1;b.classList.add("on");decide("Optie: "+b.dataset.o,el)};["pointerdown","touchstart","mousedown"].forEach(t=>b.addEventListener(t,e=>e.stopPropagation(),{passive:true}));b.addEventListener("pointerup",go);b.addEventListener("click",go)});
let sx,sy,dx=0,dy=0,on=false;el.addEventListener("pointerdown",e=>{if(e.target.closest("textarea,.chip,button,input"))return;on=true;sx=e.clientX;sy=e.clientY;el.style.transition="none";el.setPointerCapture(e.pointerId)});
el.addEventListener("pointermove",e=>{if(!on)return;dx=e.clientX-sx;dy=e.clientY-sy;el.style.transform=`translate(${dx}px,${dy}px) rotate(${dx/18}deg)`;
el.querySelector(".st-go").style.opacity=!c.o&&dx>40?1:0;el.querySelector(".st-no").style.opacity=!c.o&&dx<-40?1:0;el.querySelector(".st-la").style.opacity=dy<-50&&Math.abs(dx)<60?1:0});
el.addEventListener("pointerup",()=>{if(!on)return;on=false;el.style.transition="";
if(dy<-90&&Math.abs(dx)<80)decide("Later",el);else if(!c.o&&dx>100)decide("GO",el);else if(!c.o&&dx<-100)decide("Nee",el);else{el.style.transform="";el.querySelectorAll(".stamp").forEach(s=>s.style.opacity=0)}dx=dy=0})}
function decide(v,el){const c=todo()[0];if(!c)return;const nm=$("#name").value.trim()||"onbekend";
st.h.push({id:c.id,prev:st.d[c.id]||null});st.d[c.id]={v,door:nm,tijd:new Date().toISOString(),opmerking:st.c[c.id]||""};save();
el=el||$("#stack").lastElementChild;const x=v==="GO"?600:v==="Nee"?-600:0,y=v==="Later"?-800:v.startsWith("Optie")?-800:0;
el.style.transform=`translate(${x}px,${y}px) rotate(${x/20}deg)`;v==="GO"?fien("trots","Top, genoteerd!"):v==="Nee"?fien("gefocust","Helder, niet doen."):v==="Later"?fien("denken","Later dan!"):fien("trots","Goeie keuze!");setTimeout(render,230)}
function undo(){const h=st.h.pop();if(!h)return toast("Niets om terug te draaien");if(h.prev)st.d[h.id]=h.prev;else delete st.d[h.id];save();fien("gefocust",`${h.id} teruggezet`);render()}
function renderRes(){const nd=C.filter(c=>st.d[c.id]&&st.d[c.id].v!=="Later").length;$("#result").innerHTML=`<div class="pr"><img src="${FI.trots}" alt="Fien trots"><p class="hand" style="font-size:1.5rem">${nd} besluiten,<br>goed bezig!</p></div>`+C.map(c=>{const d=st.d[c.id];return `<div class="ri"><span class="badge b-id r1">${c.id}</span> <b>${esc(c.t)}</b><br><span>${d?`<b>${esc(d.v)}</b> · ${esc(d.door)} · ${new Date(d.tijd).toLocaleString("nl-NL")}${d.opmerking?`<br><i>${esc(d.opmerking)}</i>`:""}`:"<i>nog open</i>"}</span></div>`}).join("")}
function md(){let s="# Bubbly Besluiten (Suzan, 16 vragen) — export "+new Date().toLocaleString("nl-NL")+"\n\n";C.forEach(c=>{const d=st.d[c.id];s+=`- **${c.id}** ${c.t} (beslist: ${c.who}): ${d?`${d.v} — ${d.door}, ${new Date(d.tijd).toLocaleString("nl-NL")}${d.opmerking?` — "${d.opmerking}"`:""}`:"open"}\n`});return s}
function exp(){const json={export:new Date().toISOString(),besluiten:C.filter(c=>st.d[c.id]).map(c=>({id:c.id,titel:c.t,beslisser:c.who,...st.d[c.id]}))};
const txt=md()+"\n```json\n"+JSON.stringify(json,null,2)+"\n```\n";window.__export=txt;
try{navigator.clipboard&&navigator.clipboard.writeText(txt).catch(()=>{})}catch(e){}
const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([txt],{type:"text/markdown"}));a.download="bubbly-besluiten.md";a.click();toast("Gekopieerd en gedownload")}
function toast(m){const t=$("#toast");t.textContent=m;t.style.opacity=1;clearTimeout(t._);t._=setTimeout(()=>t.style.opacity=0,1600)}
document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>{F=b.dataset.f;document.querySelectorAll(".tabs button").forEach(x=>x.setAttribute("aria-selected",x===b));render()});
$("#bGo").onclick=()=>decide("GO");$("#bNo").onclick=()=>decide("Nee");$("#bLa").onclick=()=>decide("Later");$("#bUndo").onclick=undo;$("#bExp").onclick=exp;
render();
