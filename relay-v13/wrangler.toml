# Nieuwe Worker naast de bestaande fien-relay (die blijft ongemoeid).
name = "fien-relay-v13"
main = "index.js"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[[r2_buckets]]
binding = "FIEN"
bucket_name = "bubblyfien"

[browser]
binding = "BROWSER"

[triggers]
crons = ["7,37 * * * *"]  # :07 screenshot + herkansing, :37 alleen herkansing

# Secrets (wrangler secret put …): FIEN_WEBHOOK_URL, FIEN_WEBHOOK_KEY, PIN, FOTO_SECRET, FIEN_PENDING_KEY (GET /pending)
# Optioneel var EXTRA_ORIGINS (komma-gescheiden) voor een preview-origin.
