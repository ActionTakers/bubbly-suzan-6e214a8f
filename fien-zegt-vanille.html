<p><a href="./">← terug naar de 16 vragen</a></p><h1>Fien zegt — pilot vanillecake</h1>
<p class="note">Concept-tips (bron: repo-export d32ee15 = live site). Kies per tip: Eens, Aanpassen of Niet eens. Antwoorden blijven alleen op dit toestel; druk onderaan op <b>Kopieer antwoorden</b> en stuur ze zelf door.</p>
<label>Naam: <input id="naam" placeholder="Suzan"></label><div id="cards"></div>
<button id="copy">Kopieer antwoorden</button><textarea id="out" rows="6" readonly style="display:none"></textarea>
<script>const T=[{"n": "1", "s": "Verwarm de oven voor op 165 °C boven-/onderwarmte. Vet een springvorm van 20–22 cm goed in en bekleed de bodem met bakpapier.", "t": "Uit mijn eigen keuken: Zo komt je cake naadloos los — geen scheuren, geen drama aan de rand. Bak met liefde, niet met perfectie."}, {"n": "2", "s": "Weeg suiker, zelfrijzend bakmeel en bakpoeder nauwkeurig af en zeef de droge ingrediënten samen in een kom.", "t": "Even tussen ons: Zeven = lucht inbrengen vóórdat je begint. Klein moeite, groot verschil in de kruim. Ik geloof in je!"}, {"n": "3", "s": "Leg boterblokjes, eieren en melk minstens een uur vóór gebruik uit de koelkast zodat alles op kamertemperatuur is.", "t": "Mijn grootste bakramp begon precies hier: Koude boter klopt niet luchtig — je krijgt een schiftend, klonterig beslag. Niet skippen. Neem je tijd, je keuken loopt niet weg."}, {"n": "4", "s": "Klop de zachte boter met de suiker minstens 5–7 minuten op hoge stand tot het mengsel bleek, licht en volumineus is. Voeg daarna de eieren één voor één toe en klop steeds tot volledig opgenomen.", "t": "Dit leerde ik met vallen en opstaan: Langer kloppen = méér lucht = hogere, zachtere cake. Dit is de stap die het verschil maakt. Doe het echt. Lukt het niet meteen? Dan heb je een verhaal."}, {"n": "5", "s": "Spatel de gezeefde bloem en bakpoeder in twee delen luchtig door het beslag. Voeg vanille-extract en melk toe en meng kort tot een glad, luchtig beslag zonder droge plekken.", "t": "Hier wil je even bij blijven: Stop zodra alles net gemengd is — overmixen slaat de opgebouwde lucht eruit en je cake wordt compact. Knoeien mag!"}, {"n": "6", "s": "Giet het beslag in de voorbereide vorm, strijk de bovenkant glad en bak 40–45 minuten. Een prikker die er met enkele vochtige kruimels uitkomt = perfect. Laat 10–15 minuten in de vorm afkoelen.", "t": "Mijn oma zei altijd bij deze stap: Ovendeur openen in de eerste 30 minuten? Cake zakt in. Wacht geduldig tot minuut 35 voor de check. Gaat het scheef? Dan wordt hij gewoon extra eigen."}, {"n": "7", "s": "Stort de cake voorzichtig op een rooster en laat hem volledig afkoelen. Haast is de vijand van een mooie cake — hij moet stevig zijn voor je hem snijdt.", "t": "Psst, bij deze vanille luchtcake basis: Cake volledig afgekoeld in de vriezer voor 20 minuten = scherpe sneden zonder kruimels. Snuif gerust even aan je kom, zo ruikt geluk."}, {"n": "8", "s": "Snijd de volledig afgekoelde cake horizontaal in gelijke lagen met een lang kartelmes en rustige zaagbewegingen.", "t": "Mijn geheimpje voor vanille luchtcake basis: Gebruik tandenpokhoutenprikkers als gidspunten aan de zijkanten voor perfecte gelijke lagen. Kruimels horen erbij."}, {"n": "9", "s": "Vul en frost de cake naar wens met roomkaasfrosting, slagroom of een laagje jam. Zorg dat de cake écht koud is zodat de topping niet wegzakt.", "t": "Fien-trucje: Scheve lagen of een gekantelde topping? Extra sprinkles en niemand kijkt meer naar de constructie. Zet er een liedje bij en geniet."}];const K="fienzegt-vanille-v1";let S=JSON.parse(localStorage.getItem(K)||"{}");const sv=()=>localStorage.setItem(K,JSON.stringify(S));
const e=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
document.getElementById("cards").innerHTML=T.map(t=>`<div class="card" data-n="${t.n}"><div class="stap"><b>Stap ${t.n}</b> · ${e(t.s)}</div><div class="tip">💬 ${e(t.t)}</div><div class="row">${["Eens","Aanpassen","Niet eens"].map(o=>`<button data-o="${o}">${o}</button>`).join("")}</div><textarea placeholder="Opmerking of betere tekst (optioneel)"></textarea></div>`).join("");
document.querySelectorAll(".card").forEach(c=>{const n=c.dataset.n,s=S[n]||(S[n]={});c.querySelectorAll("button").forEach(b=>{if(s.k===b.dataset.o)b.classList.add("on");b.onclick=()=>{s.k=b.dataset.o;sv();c.querySelectorAll("button").forEach(x=>x.classList.toggle("on",x===b))}});const ta=c.querySelector("textarea");ta.value=s.m||"";ta.oninput=()=>{s.m=ta.value;sv()}});
const nm=document.getElementById("naam");nm.value=localStorage.getItem(K+"-n")||"";nm.oninput=()=>localStorage.setItem(K+"-n",nm.value);
document.getElementById("copy").onclick=async()=>{let x="Fien zegt — pilot vanillecake — "+(nm.value||"onbekend")+" — "+new Date().toLocaleString("nl-NL")+"\n";T.forEach(t=>{const s=S[t.n]||{};x+=`Stap ${t.n}: ${s.k||"open"}${s.m?` — "${s.m}"`:""}\n`});const o=document.getElementById("out");o.value=x;o.style.display="block";
try{await navigator.clipboard.writeText(x);alert("Gekopieerd!")}catch(_){o.select();document.execCommand("copy");alert("Tekst staat hieronder; kopieer hem zelf als dat niet lukte.")}};
</script></body></html>
